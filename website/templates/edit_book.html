
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container dashboard">
        <section class="panel">
            <h1 class="panel-title">Edit Book</h1>

            <form
                action="{{ url_for('edit_book', book_id=book.book_id) }}"
                method="POST"
            >
                <input
                    type="text"
                    name="title"
                    placeholder="Book title"
                    value="{{ book.title }}"
                    required
                >

                <input
                    type="number"
                    name="price"
                    placeholder="Book price"
                    value="{{ book.price }}"
                    min="0"
                    step="0.01"
                    required
                >

                <select name="author_id" required>
                    {% for author in authors %}
                        <option
                            value="{{ author.author_id }}"
                            {% if author.author_id == book.author_id %}selected{% endif %}
                        >
                            {{ author.name }}
                        </option>
                    {% endfor %}
                </select>

                <button class="btn btn-primary" type="submit">
                    Save Changes
                </button>

                <a href="{{ url_for('library_page') }}">
                    Cancel
                </a>
            </form>
        </section>
    </main>
</body>
</html>
