
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Author</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container dashboard">
        <section class="panel">
            <h1 class="panel-title">Edit Author</h1>

            <form
                action="{{ url_for('edit_author', author_id=author.author_id) }}"
                method="POST"
            >
                <input
                    type="text"
                    name="name"
                    placeholder="Author name"
                    value="{{ author.name }}"
                    required
                >

                <input
                    type="text"
                    name="country"
                    placeholder="Country"
                    value="{{ author.country }}"
                    required
                >

                <button class="btn btn-primary" type="submit">
                    Save Changes
                </button>

                <a href="{{ url_for('library_page') }}">Cancel</a>
            </form>
        </section>
    </main>
</body>
</html>
